# golangci-lint configuration for kush.
#
# golint-sl runs as a module plugin baked into ./custom-gcl (see .custom-gcl.yml).
# The prebuilt golangci-lint cannot load the plugin, so run it with
# `mise run lint`, which builds custom-gcl and runs it.
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - dogsled
    - copyloopvar
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - whitespace
    - unconvert
    - unparam

    # golint-sl: production-ready Go patterns (error handling, observability, safety)
    # https://golint.specht-labs.de/
    - golint-sl

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    custom:
      golint-sl:
        type: module
        description: SpechtLabs Go linter collection for production-ready code
        original-url: github.com/spechtlabs/golint-sl

  exclusions:
    generated: lax
    rules:
      # Hold test files to a lighter bar than production code.
      - linters:
          - gosec
          - goconst
          - golint-sl
        path: _test\.go

      - linters:
          - govet
        text: "^fieldalignment:"
        path: _test\.go

      # pkg/kubeconfig is a reusable library: it returns idiomatic `error` and
      # wraps at the point each error originates, so it does not adopt the
      # application's humane.Error return type or re-wrap on propagation.
      # Load is the convenience form of LoadFrom, which takes the loading
      # rules as a dependency; building the default rules is its whole job.
      - linters:
          - golint-sl
        text: "^(humaneerror|errorwrap):"
        path: ^pkg/kubeconfig/
      - linters:
          - golint-sl
        text: "^interfaceconsistency: creating NewDefaultClientConfigLoadingRules"
        path: ^pkg/kubeconfig/kubeconfig\.go$

      # shell.Exec returns the raw *exec.ExitError so the caller can read the
      # child's exit code; it cannot convert to humane.Error or wrap that path.
      # The grace period before killing a child that ignores SIGTERM waits on
      # a real process, which an injected clock cannot speed up.
      - linters:
          - golint-sl
        text: "^(humaneerror|errorwrap):"
        path: ^internal/shell/
      - linters:
          - golint-sl
        text: "^clockinterface:"
        path: ^internal/shell/shell_unix\.go$

      # kush runs what its user asked for: their shell, their pre-exec and
      # post-exec hooks, the command after `kush exec --`, and fzf from PATH.
      - linters:
          - gosec
        text: "^(G204|G702):"
        path: ^(cmd/kush/hooks\.go|internal/picker/picker\.go|internal/shell/)

      # The private temp dir lives under $XDG_RUNTIME_DIR or the system temp
      # dir by design, and is 0700 on purpose: its owner has to list it to
      # sweep stale kubeconfigs.
      - linters:
          - gosec
        text: "^(G302|G703):"
        path: ^internal/tempkube/temp\.go$

    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
