# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below define how kush is built and checked. CI uses these tasks.
# Renovate keeps every pin in this file current.

# mise reads the go directive of go.mod as the Go version to use, which is
# only the minimum language version, not the toolchain. Every tool comes from
# this file only.
[settings]
idiomatic_version_file_enable_tools = []

[tools]
# The go directive in go.mod is the minimum language version, bumped by hand;
# this is the toolchain everything runs on.
go = "1.27.1"
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"

# Pre-commit for Git hooks
pre-commit = "4.6.2"

# Linters. golangci-lint must match the version in .custom-gcl.yml; Renovate
# groups the two into one PR.
golangci-lint = "2.14.0"
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't.
shellcheck = "0.11.0"

# Release tooling. GoReleaser signs the checksums with cosign.
goreleaser = "2.18.2"
cosign = "3.1.3"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.0"

# Documentation website (docs/): VuePress builds under bun, and bun runs
# .github/commit-lint, the squash commit message check in pr-hygiene.yaml.
# markdownlint-cli2 is an npm package, which mise installs with node.
bun = "1.4.2"
node = "24.21.0"
markdownlint-cli2 = "0.23.3"

# Trying kush against a throwaway local cluster.
kind = "0.33.0"
kubectl = "1.37.1"
k9s = "0.51.0"

[tasks.build]
description = "Build the kush binary into bin/"
run = "go build -o bin/kush ./cmd/kush/"

[tasks.test]
description = "Run the test suite with race detector and coverage"
run = "go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.txt ./..."

# `mise run fmt` rewrites everything that has a canonical form; `mise run
# lint` checks the same things without touching a file. go mod tidy runs
# first, because it may rewrite go.mod.
[tasks.fmt]
description = "Format everything: go.mod, Go sources and Markdown"
run = [
  { task = "go-tidy" },
  { task = "go-fmt" },
  { task = "md-fmt" },
]

[tasks.go-tidy]
description = "Tidy go.mod and go.sum"
run = "go mod tidy"

# The same gofmt and goimports settings `mise run lint` checks, read from
# .golangci.yaml.
[tasks.go-fmt]
description = "Format Go sources with the formatters configured for golangci-lint"
run = "golangci-lint fmt"

[tasks.md-fmt]
description = "Fix what markdownlint can fix in every Markdown file .markdownlint-cli2.yaml covers"
run = "markdownlint-cli2 --fix"

# golint-sl runs as a golangci-lint module plugin, so it has to be compiled into
# a custom binary (./custom-gcl). Rebuilds only when .custom-gcl.yml changes.
[tasks.lint-build]
description = "Build the custom-gcl binary with the golint-sl plugin baked in"
# The build downloads golangci-lint's whole dependency tree, and the module
# proxy sometimes resets the HTTP/2 stream partway through. Modules already
# downloaded stay in the cache, so a retry picks up where it failed.
run = """
for attempt in 1 2 3; do
  golangci-lint custom && exit 0
  echo "golangci-lint custom failed (attempt $attempt of 3)" >&2
  sleep 10
done
exit 1
"""
sources = [".custom-gcl.yml"]
outputs = ["custom-gcl"]

# GoReleaser builds the tagged tree as it is, and package.nix vendors what
# go.sum lists, so an untidy go.mod has to fail CI rather than be fixed up at
# release time.
[tasks.mod-tidy]
description = "Check that go.mod and go.sum are tidy"
run = "go mod tidy -diff"

[tasks.lint]
description = "Lint the module with golangci-lint and golint-sl, YAML and workflows"
depends = ["lint-build", "yaml-lint", "actionlint"]
run = "./custom-gcl run ./..."

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.release-check]
description = "Validate the GoReleaser config"
run = "goreleaser check"

[tasks.snapshot]
description = "Build a local GoReleaser snapshot into dist/"
run = "goreleaser build --snapshot --clean"

[tasks.check]
description = "The definition of done: every gate CI runs on the Go code (the Nix build runs in CI only)"
depends = [
  "lint",
  "mod-tidy",
  "test",
  "release-check",
]

[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run -e 'SpechtLabs/StaticPages-Upload'"

[tasks.docs-lint]
description = "Lint every Markdown file .markdownlint-cli2.yaml covers (the docs workflow's first job)"
run = "markdownlint-cli2"

[tasks.docs-dev]
description = "Serve the documentation website locally with hot reload"
dir = "docs"
run = ["bun install", "bun run dev"]

[tasks.docs-build]
description = "Build the documentation website (the docs workflow's second job)"
dir = "docs"
run = ["bun install --frozen-lockfile", "bun run build"]

# package.nix pins the hash of the vendored Go modules, so every go.sum change
# (Renovate's included) needs a new one, or the Nix job in CI fails. Needs nix.
[tasks."nix:update-hash"]
description = "Regenerate vendorHash in package.nix after a go.sum change"
run = '''
  output=$(nix build --no-link 2>&1)
  if [ $? -eq 0 ]; then
    echo "Build succeeded — vendorHash is already correct."
    exit 0
  fi

  got=$(printf '%s' "$output" | grep -oE 'got:\s*sha256-[A-Za-z0-9+/=]+' | awk '{print $2}')
  if [ -z "$got" ]; then
    echo "$output" >&2
    echo "Build failed for a reason other than a vendorHash mismatch." >&2
    exit 1
  fi

  # -i.bak works with both GNU and BSD sed.
  sed -i.bak "s|vendorHash = \".*\";|vendorHash = \"$got\";|" package.nix && rm package.nix.bak
  echo "vendorHash updated to $got"
'''
