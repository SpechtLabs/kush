name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/**
      - "**.md"
      - .markdownlint-cli2.yaml
      - .mise.toml
      - .github/workflows/docs-website.yaml
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - docs/**
      - "**.md"
      - .markdownlint-cli2.yaml
      - .mise.toml
      - .github/workflows/docs-website.yaml
  # Releases and contributors are fetched from the GitHub API at build time,
  # so rebuild daily to keep them current between pushes. The schedule has no
  # path filter and always deploys.
  schedule:
    - cron: "17 4 * * *"

# Each job installs the tools it needs with mise-action's install_args. Without
# this, `mise run` installs every tool in .mise.toml first, gopls and delve
# included, which makes each job wait on (and fail with) the module proxy for
# tools it never runs.
env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned; go.yaml explains why.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.6

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  md:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs the markdownlint-cli2 pinned in .mise.toml, so local and CI agree.
      # markdownlint-cli2 is an npm package, and mise installs it with the node
      # .mise.toml pins, so node comes first.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node markdownlint-cli2

      - name: Lint docs
        run: mise run docs-lint

  build:
    name: Build (Docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: bun

      - name: Build
        run: mise run docs-build
        env:
          # Authenticates the build-time GitHub API calls for releases and
          # contributors (60 requests/hour without it, 1,000 with it).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        # Only the deploy job consumes this, and it runs on push/dispatch/schedule.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: docs/.vuepress/dist
          retention-days: 1

  # kush.specht-labs.de is served by Static Pages.
  deploy-static-pages:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - build
      - md
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Download Artifacts for Website
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: ./dist

      - name: Upload to Static Pages
        uses: SpechtLabs/StaticPages-Upload@c5fc82dbaef3e70314270b739e45af77fa7b3f22 # main
        with:
          endpoint: https://pages.specht-labs.de
          site-dir: dist/
